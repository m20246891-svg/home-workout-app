<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Домашние тренировки</title>
    <meta name="description" content="Персональные тренировки дома на каждый день: генератор под самочувствие и 28-дневный план" />
    <meta name="theme-color" content="#0A0A0A" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- SDK Telegram Mini App: грузим только при запуске из Telegram (он добавляет tgWebApp* в URL). -->
    <script>
      if (/tgWebApp/.test(location.hash + location.search) || sessionStorage.getItem('tg') === '1') {
        sessionStorage.setItem('tg', '1')
        document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>')
      }
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Тренировки" />
  </head>
  <body class="bg-white text-gray-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
